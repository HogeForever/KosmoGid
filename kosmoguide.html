<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="КосмоГид — ғарыш, астрономия және планетарийлер туралы білім беру платформасы">
<title>КосмоГид — Ғарышты зерттеу платформасы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* base surfaces */
  --void:#040509;
  --void-2:#07080f;
  --nebula:#0a0d1f;
  --nebula-2:#101430;
  --panel:rgba(255,255,255,0.035);
  --panel-strong:rgba(255,255,255,0.06);
  --glass:rgba(255,255,255,0.04);
  --glass-brd:rgba(150,145,255,0.16);
  --glass-brd-strong:rgba(150,145,255,0.32);
  /* accent system */
  --indigo:#1c2250;
  --violet:#7b5cf0;
  --violet-2:#5b3fd6;
  --violet-soft:rgba(123,92,240,0.14);
  --cyan:#49c9f0;
  --cyan-soft:rgba(73,201,240,0.14);
  --gold:#e8c07a;
  --gold-soft:rgba(232,192,122,0.12);
  /* text */
  --ink:#f2f3fb;
  --ink-dim:#9ba0c2;
  --ink-dimmer:#666b8c;
  --danger:#ef6b7c;
  --ok:#4fd39a;
  /* geometry */
  --radius-s:10px;
  --radius-m:16px;
  --radius-l:24px;
  --radius-xl:32px;
  --ease:cubic-bezier(.22,.9,.32,1);
  font-size:16px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
html,body{background:var(--void);color:var(--ink);}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  min-height:100vh;
  overflow-x:hidden;
  position:relative;
  font-feature-settings:"ss01" on;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,.brand,.display{
  font-family:'Space Grotesk','Inter',sans-serif;
  letter-spacing:-0.015em;
  font-weight:600;
  line-height:1.15;
}
.mono{font-family:'JetBrains Mono',monospace;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
  outline:2px solid var(--cyan);outline-offset:2px;border-radius:6px;
}
ul{list-style:none;}
input,select,textarea{font-family:inherit;}
::selection{background:var(--violet);color:#fff;}
@media (prefers-reduced-motion: reduce){ *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;} }

/* starfield */
#starfield{position:fixed;inset:0;z-index:0;pointer-events:none;}

/* topbar */
.topbar{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;justify-content:space-between;
  padding:13px 30px;
  background:rgba(5,6,12,0.62);
  backdrop-filter:blur(20px) saturate(140%);
  -webkit-backdrop-filter:blur(20px) saturate(140%);
  border-bottom:1px solid rgba(150,145,255,0.10);
  transition:background .3s var(--ease);
}
.brand{display:flex;align-items:center;gap:11px;font-weight:600;font-size:1.2rem;}
.brand-mark{
  width:32px;height:32px;border-radius:9px;position:relative;flex-shrink:0;
  background:linear-gradient(155deg,var(--nebula-2),var(--void-2));
  border:1px solid var(--glass-brd-strong);
  display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 0 10px rgba(123,92,240,0.25), 0 0 16px rgba(123,92,240,0.22);
}
.brand-mark::before{
  content:'';width:10px;height:10px;border-radius:50%;
  background:radial-gradient(circle at 32% 30%, var(--cyan), var(--violet) 70%);
  box-shadow:0 0 10px rgba(73,201,240,0.8);
}
nav.mainnav{display:flex;gap:2px;align-items:center;flex-wrap:wrap;}
nav.mainnav a{
  padding:8px 13px;border-radius:999px;font-size:0.84rem;color:var(--ink-dim);font-weight:500;
  transition:all .2s var(--ease);white-space:nowrap;position:relative;
}
nav.mainnav a:hover{background:var(--panel);color:var(--ink);}
nav.mainnav a.active{background:var(--panel-strong);color:var(--ink);box-shadow:inset 0 0 0 1px var(--glass-brd-strong);}
.topbar-right{display:flex;align-items:center;gap:8px;}
.icon-btn{
  width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  background:var(--panel);border:1px solid var(--glass-brd);font-size:0.95rem;position:relative;transition:.2s var(--ease);color:var(--ink-dim);
}
.icon-btn:hover{background:var(--violet-soft);border-color:var(--glass-brd-strong);color:var(--ink);transform:translateY(-1px);}
.badge-dot{position:absolute;top:-3px;right:-3px;min-width:15px;height:15px;padding:0 3px;border-radius:999px;background:var(--gold);border:2px solid var(--void);font-size:0.6rem;font-weight:700;color:#1a1200;display:flex;align-items:center;justify-content:center;}
.lang-switch{display:flex;background:var(--panel);border:1px solid var(--glass-brd);border-radius:999px;overflow:hidden;}
.lang-switch button{padding:7px 12px;font-size:0.74rem;font-weight:700;color:var(--ink-dimmer);letter-spacing:.02em;transition:.2s;}
.lang-switch button.active{background:var(--violet);color:#fff;}
.pill-btn{
  padding:10px 19px;border-radius:999px;font-size:0.84rem;font-weight:600;
  background:linear-gradient(135deg,var(--violet),var(--violet-2));color:#fff;
  box-shadow:0 6px 20px -6px rgba(123,92,240,0.55);transition:.22s var(--ease);
}
.pill-btn:hover{transform:translateY(-1px);box-shadow:0 8px 26px -4px rgba(123,92,240,0.65);}
.pill-btn:active{transform:translateY(0);}
.pill-btn.ghost{background:var(--panel);border:1px solid var(--glass-brd);box-shadow:none;color:var(--ink);}
.pill-btn.ghost:hover{border-color:var(--glass-brd-strong);}
.hamburger{display:none;width:38px;height:38px;border-radius:10px;background:var(--panel);border:1px solid var(--glass-brd);align-items:center;justify-content:center;}
.hamburger span{display:block;width:16px;height:2px;background:var(--ink);position:relative;}
.hamburger span::before,.hamburger span::after{content:'';position:absolute;left:0;width:16px;height:2px;background:var(--ink);}
.hamburger span::before{top:-5px;}.hamburger span::after{top:5px;}

/* search overlay */
.search-modal{max-width:560px;width:100%;padding:0;overflow:visible;background:var(--nebula);}
.search-input-row{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--glass-brd);}
.search-input-row input{flex:1;background:transparent;border:none;color:var(--ink);font-size:1.05rem;}
.search-input-row input:focus{outline:none;}
.search-results{max-height:60vh;overflow:auto;padding:10px;}
.search-result-item{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:var(--radius-s);transition:.15s;cursor:pointer;}
.search-result-item:hover,.search-result-item.kbd-active{background:var(--violet-soft);}
.search-result-item .sr-em{width:34px;height:34px;border-radius:9px;background:var(--panel);display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0;}
.search-result-item .sr-meta{font-size:0.72rem;color:var(--ink-dimmer);}
.search-empty{padding:30px 20px;text-align:center;color:var(--ink-dimmer);font-size:0.85rem;}

/* notifications */
.notif-panel{position:absolute;right:0;top:48px;width:340px;max-height:420px;overflow:auto;background:var(--nebula);border:1px solid var(--glass-brd);border-radius:var(--radius-m);box-shadow:0 24px 60px -20px rgba(0,0,0,0.6);z-index:120;}
.notif-item{padding:13px 16px;border-bottom:1px solid rgba(255,255,255,0.05);font-size:0.83rem;display:flex;gap:10px;align-items:flex-start;}
.notif-item.unread{background:rgba(123,92,240,0.06);}
.notif-item .n-em{font-size:1.05rem;}
.notif-item .n-time{color:var(--ink-dimmer);font-size:0.72rem;margin-top:3px;}
.notif-empty{padding:34px 20px;text-align:center;color:var(--ink-dimmer);font-size:0.83rem;}

main{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:0 28px 90px;}
.crumbs{display:flex;gap:6px;align-items:center;color:var(--ink-dimmer);font-size:0.82rem;margin:22px 0 6px;}
.crumbs a:hover{color:var(--cyan);}

/* hero */
.hero{
  position:relative;padding:96px 10px 64px;text-align:center;overflow:hidden;
  margin:0 -28px;
}
.hero-layer{position:absolute;inset:0;transition:transform .25s var(--ease);will-change:transform;pointer-events:none;}
.orbits{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:900px;height:900px;pointer-events:none;opacity:.5;}
.orbits div{position:absolute;border:1px solid rgba(150,145,255,0.14);border-radius:50%;left:50%;top:50%;}
.orbit1{width:340px;height:340px;transform:translate(-50%,-50%) rotate(8deg);}
.orbit2{width:540px;height:540px;transform:translate(-50%,-50%) rotate(-6deg);}
.orbit3{width:760px;height:760px;transform:translate(-50%,-50%) rotate(4deg);}
.hero-badge{
  display:inline-flex;align-items:center;gap:8px;padding:7px 16px 7px 8px;border-radius:999px;
  background:var(--panel);border:1px solid var(--glass-brd-strong);font-size:0.72rem;font-weight:600;
  letter-spacing:.06em;color:var(--ink-dim);margin-bottom:22px;position:relative;z-index:2;
}
.hero-badge .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);}
.hero-eyebrow{ font-size:0.9rem;color:var(--cyan);font-weight:600; }
.hero h1{
  font-size:clamp(2.6rem,6.4vw,4.8rem);font-weight:700;margin:6px 0 18px;letter-spacing:-0.02em;
  background:linear-gradient(135deg,#fff 15%,var(--cyan) 60%,var(--violet) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  position:relative;z-index:2;
}
.hero p.tagline{color:var(--ink-dim);font-size:1.1rem;max-width:600px;margin:0 auto 12px;position:relative;z-index:2;}
.hero p.subtag{color:var(--ink-dimmer);font-size:0.92rem;max-width:520px;margin:0 auto 34px;position:relative;z-index:2;line-height:1.6;}
.hero-actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;position:relative;z-index:2;margin-bottom:46px;}

/* hero interactive planet chips */
.hero-objects{position:relative;z-index:2;max-width:820px;margin:0 auto;display:flex;justify-content:center;gap:26px;flex-wrap:wrap;}
.hero-obj{
  position:relative;width:64px;height:64px;border-radius:50%;cursor:pointer;transition:transform .25s var(--ease),box-shadow .25s var(--ease);
  display:flex;align-items:center;justify-content:center;font-size:1.6rem;
  border:1px solid var(--glass-brd);background:var(--panel);
}
.hero-obj:hover{transform:translateY(-6px) scale(1.08);box-shadow:0 14px 34px -10px var(--obj-glow,rgba(123,92,240,0.6));border-color:var(--glass-brd-strong);}
.hero-obj-card{
  position:absolute;bottom:82px;left:50%;transform:translateX(-50%) translateY(6px);
  width:190px;padding:14px 16px;border-radius:var(--radius-m);background:var(--nebula);
  border:1px solid var(--glass-brd-strong);box-shadow:0 20px 50px -14px rgba(0,0,0,0.6);
  opacity:0;pointer-events:none;transition:opacity .2s var(--ease),transform .2s var(--ease);text-align:left;z-index:5;
}
.hero-obj:hover .hero-obj-card{opacity:1;transform:translateX(-50%) translateY(0);}
.hero-obj-card b{display:block;font-size:0.88rem;margin-bottom:6px;}
.hero-obj-card .hoc-row{display:flex;justify-content:space-between;font-size:0.72rem;color:var(--ink-dimmer);margin-top:2px;}

/* section grid */
.section{margin-top:64px;}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px;gap:12px;flex-wrap:wrap;}
.section-head h2{font-size:1.6rem;font-weight:700;}
.section-head p{color:var(--ink-dimmer);font-size:0.9rem;margin-top:4px;}
.see-all{font-size:0.85rem;color:var(--cyan);white-space:nowrap;}

.bento{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
.bento a.tile{
  grid-column:span 1;padding:26px 18px;border-radius:var(--radius-m);
  background:var(--glass);border:1px solid var(--glass-brd);
  display:flex;flex-direction:column;gap:10px;transition:.2s;
}
.bento a.tile:hover{transform:translateY(-3px);border-color:var(--violet);background:rgba(139,107,255,0.09);}
.tile .em{font-size:1.7rem;}
.tile b{font-size:1rem;}
.tile span{color:var(--ink-dimmer);font-size:0.8rem;}

.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
.card{
  background:var(--panel);border:1px solid var(--glass-brd);border-radius:var(--radius-m);
  overflow:hidden;transition:transform .25s var(--ease),border-color .25s var(--ease),box-shadow .25s var(--ease);display:flex;flex-direction:column;
}
.card:hover{transform:translateY(-4px);border-color:var(--glass-brd-strong);box-shadow:0 20px 44px -18px rgba(20,10,60,0.55);}
.card-media{
  height:140px;display:flex;align-items:center;justify-content:center;font-size:2.6rem;position:relative;overflow:hidden;
}
.card-media::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,0.08),transparent 60%);}
.card:hover .card-media span,.card:hover .card-media{transform:scale(1.04);}
.card-body{padding:17px 19px 19px;display:flex;flex-direction:column;gap:8px;flex:1;}
.card-body h3{font-size:1.02rem;font-weight:600;}
.card-body p{color:var(--ink-dimmer);font-size:0.83rem;line-height:1.55;}
.meta-row{display:flex;gap:8px;flex-wrap:wrap;font-size:0.75rem;color:var(--ink-dimmer);}
.tag{padding:3px 10px;border-radius:999px;background:var(--cyan-soft);color:var(--cyan);font-size:0.7rem;font-weight:600;}
.tag.violet{background:var(--violet-soft);color:#c9bcff;}
.tag.gold{background:var(--gold-soft);color:var(--gold);}
.tag.ok{background:rgba(79,211,154,0.14);color:var(--ok);}
.card-cta{margin-top:auto;padding:12px 19px;border-top:1px solid rgba(255,255,255,0.05);font-size:0.81rem;color:var(--cyan);font-weight:600;display:flex;justify-content:space-between;align-items:center;}

.today-block{
  border-radius:var(--radius-l);padding:0;background:var(--panel);
  border:1px solid var(--glass-brd);overflow:hidden;
}
.today-head{display:flex;justify-content:space-between;align-items:center;padding:22px 26px;border-bottom:1px solid rgba(255,255,255,0.06);background:linear-gradient(135deg,rgba(123,92,240,0.10),rgba(73,201,240,0.04));flex-wrap:wrap;gap:10px;}
.today-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:rgba(255,255,255,0.05);}
.today-cell{background:var(--nebula);padding:20px 22px;}
.today-cell .tc-label{font-size:0.7rem;color:var(--ink-dimmer);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;}
.today-cell .tc-value{font-size:1.15rem;font-weight:600;}
.today-cell .tc-sub{font-size:0.76rem;color:var(--ink-dimmer);margin-top:4px;}

/* filters */
.filter-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:26px;align-items:center;}
.filter-bar input[type=text]{
  flex:1;min-width:220px;padding:11px 16px;border-radius:999px;background:var(--glass);
  border:1px solid var(--glass-brd);color:var(--ink);
}
.chip{
  padding:8px 15px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-brd);font-size:0.82rem;color:var(--ink-dim);
}
.chip.active{background:var(--violet);color:#fff;border-color:var(--violet);}

/* buttons generic */
.btn{padding:10px 18px;border-radius:999px;font-size:0.85rem;font-weight:600;background:var(--glass);border:1px solid var(--glass-brd);color:var(--ink);transition:.18s;}
.btn:hover{border-color:var(--violet);}
.btn.primary{background:linear-gradient(135deg,var(--violet),var(--violet-2));color:#fff;border:none;}
.btn.danger{color:var(--danger);border-color:rgba(255,107,129,0.4);}
.btn.small{padding:6px 12px;font-size:0.75rem;}
.btn.full{width:100%;}

/* detail page */
.detail-hero{display:flex;gap:30px;align-items:flex-start;flex-wrap:wrap;margin-bottom:30px;}
.detail-icon{
  width:150px;height:150px;border-radius:var(--radius-l);display:flex;align-items:center;justify-content:center;font-size:4rem;
  background:var(--glass);border:1px solid var(--glass-brd);flex-shrink:0;
}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:20px 0;}
.stat-box{background:var(--glass);border:1px solid var(--glass-brd);border-radius:var(--radius-s);padding:14px;}
.stat-box b{display:block;font-size:1.15rem;color:var(--cyan);}
.stat-box span{font-size:0.75rem;color:var(--ink-dimmer);}
.prose{color:var(--ink-dim);line-height:1.75;font-size:0.95rem;max-width:760px;}
.prose + .prose{margin-top:10px;}

/* timeline */
.timeline{position:relative;padding-left:34px;}
.timeline::before{content:'';position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--violet),var(--cyan));}
.tl-item{position:relative;margin-bottom:26px;background:var(--glass);border:1px solid var(--glass-brd);border-radius:var(--radius-m);padding:18px 20px;}
.tl-item::before{content:'';position:absolute;left:-29px;top:22px;width:12px;height:12px;border-radius:50%;background:var(--cyan);box-shadow:0 0 0 4px rgba(79,214,255,0.18);}
.tl-year{color:var(--cyan);font-weight:700;font-size:1.1rem;}

/* forum */
.forum-cats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:34px;}
.fc{padding:20px;background:var(--glass);border:1px solid var(--glass-brd);border-radius:var(--radius-m);transition:.18s;}
.fc:hover{border-color:var(--violet);transform:translateY(-2px);}
.topic-row{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;background:var(--glass);border:1px solid var(--glass-brd);border-radius:var(--radius-s);margin-bottom:10px;gap:14px;}
.topic-row:hover{border-color:var(--violet);}
.topic-row .ti{display:flex;gap:12px;align-items:center;}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--violet),var(--cyan));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.9rem;color:#fff;flex-shrink:0;}
.post{background:var(--glass);border:1px solid var(--glass-brd);border-radius:var(--radius-m);padding:16px 18px;margin-bottom:12px;display:flex;gap:14px;}
.post-body{flex:1;}
.post-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.post-actions{display:flex;gap:10px;font-size:0.75rem;color:var(--ink-dimmer);margin-top:8px;}
.post-actions button:hover{color:var(--cyan);}
textarea.field,input.field,select.field{
  width:100%;padding:11px 14px;border-radius:var(--radius-s);background:rgba(255,255,255,0.04);
  border:1px solid var(--glass-brd);color:var(--ink);resize:vertical;
}
.field-label{font-size:0.78rem;color:var(--ink-dimmer);margin-bottom:6px;display:block;font-weight:600;}
.form-row{margin-bottom:16px;}

/* zodiac */
.zodiac-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;}
.zbtn{padding:16px 8px;text-align:center;background:var(--glass);border:1px solid var(--glass-brd);border-radius:var(--radius-m);}
.zbtn:hover,.zbtn.active{border-color:var(--gold);background:rgba(255,205,122,0.1);}
.zbtn .em{font-size:1.6rem;display:block;margin-bottom:6px;}
.horo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:24px;}
.horo-card{background:var(--glass);border:1px solid var(--glass-brd);border-radius:var(--radius-m);padding:18px;}
.horo-card b{color:var(--gold);font-size:0.85rem;}

/* quiz */
.quiz-box{background:var(--glass);border:1px solid var(--glass-brd);border-radius:var(--radius-l);padding:34px;max-width:640px;margin:0 auto;}
.quiz-opt{display:block;width:100%;text-align:left;padding:14px 16px;border-radius:var(--radius-s);background:rgba(255,255,255,0.03);border:1px solid var(--glass-brd);margin-bottom:10px;transition:.15s;}
.quiz-opt:hover{border-color:var(--violet);}
.quiz-opt.correct{border-color:var(--ok);background:rgba(91,227,164,0.14);}
.quiz-opt.wrong{border-color:var(--danger);background:rgba(255,107,129,0.14);}
.progress-bar{height:6px;border-radius:999px;background:rgba(255,255,255,0.08);overflow:hidden;margin-bottom:22px;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--violet),var(--cyan));transition:width .3s;}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(2,3,10,0.72);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal{background:var(--nebula);border:1px solid var(--glass-brd);border-radius:var(--radius-l);padding:32px;max-width:440px;width:100%;max-height:88vh;overflow:auto;position:relative;}
.modal.wide{max-width:640px;}
.modal-close{position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:50%;background:var(--glass);display:flex;align-items:center;justify-content:center;}

/* toast */
#toast-wrap{position:fixed;bottom:24px;right:24px;z-index:300;display:flex;flex-direction:column;gap:10px;}
.toast{background:var(--nebula-2);border:1px solid var(--glass-brd);border-left:3px solid var(--cyan);padding:13px 18px;border-radius:var(--radius-s);font-size:0.85rem;box-shadow:0 10px 30px rgba(0,0,0,0.4);animation:slidein .25s ease;}
@keyframes slidein{from{transform:translateX(30px);opacity:0;}to{transform:translateX(0);opacity:1;}}

/* comments */
.comment{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid rgba(255,255,255,0.06);}
.comment-body{flex:1;}
.reactions{display:flex;gap:8px;margin-top:6px;}
.reactions button{font-size:0.78rem;padding:3px 9px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-brd);}

/* profile */
.profile-head{display:flex;gap:22px;align-items:center;margin-bottom:30px;flex-wrap:wrap;}
.profile-avatar{width:84px;height:84px;border-radius:50%;background:linear-gradient(135deg,var(--violet),var(--cyan));display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:700;color:#fff;}
.stat-strip{display:flex;gap:26px;flex-wrap:wrap;}
.stat-strip div b{display:block;font-size:1.3rem;color:var(--cyan);}
.stat-strip div span{font-size:0.75rem;color:var(--ink-dimmer);}

/* empty / error states */
.empty-state{text-align:center;padding:60px 20px;color:var(--ink-dimmer);}
.empty-state .em{font-size:2.4rem;margin-bottom:10px;}

/* admin */
.admin-wrap{display:flex;min-height:calc(100vh - 66px);}
.admin-side{width:230px;flex-shrink:0;background:rgba(8,9,24,0.9);border-right:1px solid rgba(140,130,255,0.14);padding:22px 14px;position:sticky;top:66px;height:calc(100vh - 66px);overflow:auto;}
.admin-side a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-s);color:var(--ink-dim);font-size:0.86rem;margin-bottom:4px;}
.admin-side a:hover,.admin-side a.active{background:rgba(139,107,255,0.16);color:#fff;}
.admin-main{flex:1;padding:30px 34px;max-width:1100px;}
.admin-tag{display:inline-block;padding:3px 10px;border-radius:6px;background:rgba(255,205,122,0.15);color:var(--gold);font-size:0.7rem;font-weight:700;letter-spacing:.03em;}
.stat-card{background:var(--glass);border:1px solid var(--glass-brd);border-radius:var(--radius-m);padding:20px;}
.stat-card b{font-size:1.7rem;display:block;}
.stat-card span{color:var(--ink-dimmer);font-size:0.78rem;}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:0.8rem;}
.bar-row .lbl{width:120px;color:var(--ink-dimmer);flex-shrink:0;}
.bar-track{flex:1;height:9px;background:rgba(255,255,255,0.06);border-radius:999px;overflow:hidden;}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--violet),var(--cyan));}
table.admin-table{width:100%;border-collapse:collapse;font-size:0.85rem;}
table.admin-table th{text-align:left;padding:10px 12px;color:var(--ink-dimmer);font-weight:600;border-bottom:1px solid var(--glass-brd);font-size:0.75rem;text-transform:uppercase;letter-spacing:.03em;}
table.admin-table td{padding:12px;border-bottom:1px solid rgba(255,255,255,0.05);}
table.admin-table tr:hover td{background:rgba(255,255,255,0.02);}
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;}

/* skeleton loading */
@keyframes shimmer{0%{background-position:-300px 0;}100%{background-position:300px 0;}}
.skel{background:linear-gradient(90deg,rgba(255,255,255,0.04) 25%,rgba(255,255,255,0.09) 37%,rgba(255,255,255,0.04) 63%);background-size:600px 100%;animation:shimmer 1.6s infinite linear;border-radius:var(--radius-s);}
.skel-card{height:230px;border-radius:var(--radius-m);border:1px solid var(--glass-brd);overflow:hidden;}
.skel-line{height:12px;margin:8px 0;}
.boot-screen{position:fixed;inset:0;z-index:500;background:var(--void);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;}
.boot-ring{width:46px;height:46px;border-radius:50%;border:2px solid rgba(150,145,255,0.18);border-top-color:var(--cyan);animation:spin 0.9s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* achievements & XP */
.xp-bar-wrap{background:var(--panel);border:1px solid var(--glass-brd);border-radius:999px;height:10px;overflow:hidden;}
.xp-bar-fill{height:100%;background:linear-gradient(90deg,var(--violet),var(--cyan));transition:width .4s var(--ease);}
.ach-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.ach-card{padding:18px;border-radius:var(--radius-m);background:var(--panel);border:1px solid var(--glass-brd);text-align:center;transition:.2s;}
.ach-card.locked{opacity:.4;filter:grayscale(0.6);}
.ach-card .ach-em{font-size:1.8rem;margin-bottom:8px;}
.ach-card b{display:block;font-size:0.86rem;margin-bottom:4px;}
.ach-card span{font-size:0.72rem;color:var(--ink-dimmer);}
.level-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;background:var(--gold-soft);color:var(--gold);font-size:0.74rem;font-weight:700;}

/* password strength */
.pw-strength{height:5px;border-radius:999px;background:var(--panel);overflow:hidden;margin-top:8px;}
.pw-strength-fill{height:100%;transition:width .25s var(--ease),background .25s var(--ease);}
.pw-hint{font-size:0.72rem;color:var(--ink-dimmer);margin-top:5px;}
.field-error{border-color:var(--danger) !important;}
.error-text{color:var(--danger);font-size:0.76rem;margin-top:5px;}

/* footer */
footer{border-top:1px solid rgba(140,130,255,0.14);margin-top:90px;padding:44px 28px 30px;position:relative;z-index:1;}
.footer-grid{max-width:1180px;margin:0 auto;display:flex;justify-content:space-between;flex-wrap:wrap;gap:30px;}
.footer-grid ul li{margin-bottom:8px;font-size:0.85rem;color:var(--ink-dim);}
.footer-bottom{max-width:1180px;margin:30px auto 0;padding-top:20px;border-top:1px solid rgba(255,255,255,0.06);display:flex;justify-content:space-between;color:var(--ink-dimmer);font-size:0.78rem;flex-wrap:wrap;gap:10px;}

/* responsive */
@media(max-width:980px){
  .bento{grid-template-columns:repeat(2,1fr);}
  .grid-3{grid-template-columns:repeat(2,1fr);}
  .grid-4{grid-template-columns:repeat(2,1fr);}
  .forum-cats{grid-template-columns:repeat(2,1fr);}
  .zodiac-grid{grid-template-columns:repeat(4,1fr);}
  .admin-side{position:fixed;left:-240px;top:66px;z-index:60;transition:.2s;background:var(--void);}
  .admin-side.open{left:0;}
  .admin-main{padding:22px 16px;}
  .today-grid{grid-template-columns:repeat(2,1fr);}
  .ach-grid{grid-template-columns:repeat(2,1fr);}
}
@media(max-width:720px){
  nav.mainnav{display:none;position:fixed;top:66px;left:0;right:0;background:var(--void);flex-direction:column;padding:14px;border-bottom:1px solid var(--glass-brd);align-items:stretch;}
  nav.mainnav.open{display:flex;}
  nav.mainnav a{padding:12px;}
  .hamburger{display:flex;}
  .bento{grid-template-columns:1fr 1fr;}
  .grid-3,.grid-4{grid-template-columns:1fr;}
  .zodiac-grid{grid-template-columns:repeat(3,1fr);}
  .horo-grid{grid-template-columns:1fr;}
  main{padding:0 16px 70px;}
  .hero{margin:0 -16px;padding:64px 8px 50px;}
  .detail-hero{flex-direction:column;}
  .admin-wrap{flex-direction:column;}
  .admin-side{width:100%;position:static;height:auto;display:none;}
  .topbar{padding:12px 16px;}
  .today-grid{grid-template-columns:1fr 1fr;}
  .ach-grid{grid-template-columns:1fr;}
  .hero-objects{gap:14px;}
  .hero-obj{width:52px;height:52px;font-size:1.3rem;}
  .hero-obj-card{width:160px;}
  .notif-panel{width:280px;right:-60px;}
  .search-modal{max-width:100%;}
}

function computeAchievements(user, me, ctx){
  return ACHIEVEMENTS.map(a=>{
    let unlocked=false;
    try{
      if(a.id==="champion"){
        const others = ACHIEVEMENTS.filter(x=>x.id!=="champion");
        const n = others.filter(x=>x.check(user,me,{...ctx})).length;
        unlocked = n>=others.length;
      } else { unlocked = a.check(user,me,ctx); }
    }catch(e){ unlocked=false; }
    return {...a, unlocked};
  });
}
function moonPhase(date){
  const synodic = 29.530588853;
  const known = new Date(2000,0,6,18,14).getTime();
  const diff = (date.getTime()-known)/86400000;
  let phase = (diff % synodic)/synodic; if(phase<0) phase+=1;
  const names = LANG==='kz'
    ? ["Жаңа ай","Өсу тоғышары","Бірінші ширек","Өсу дөңесі","Толық ай","Кему дөңесі","Соңғы ширек","Кему тоғышары"]
    : ["Новолуние","Растущий серп","Первая четверть","Растущая луна","Полнолуние","Убывающая луна","Последняя четверть","Убывающий серп"];
  const idx = Math.floor(phase*8)%8;
  const emojis = ["🌑","🌒","🌓","🌔","🌕","🌖","🌗","🌘"];
  return {name:names[idx], em:emojis[idx], illum: Math.round((1-Math.cos(phase*2*Math.PI))/2*100)};
}

function pwStrength(pw){
  if(!pw) return {pct:0,label:"",color:"var(--danger)"};
  let score=0;
  if(pw.length>=6) score++;
  if(pw.length>=10) score++;
  if(/[A-ZА-ЯӘҒҚҢӨҰҮҺІ]/.test(pw)) score++;
  if(/[0-9]/.test(pw)) score++;
  if(/[^a-zA-Zа-яА-Я0-9]/.test(pw)) score++;
  if(score<=1) return {pct:25,label:t('strength_weak'),color:"var(--danger)"};
  if(score<=3) return {pct:60,label:t('strength_mid'),color:"var(--gold)"};
  return {pct:100,label:t('strength_strong'),color:"var(--ok)"};
}

let quizState = null; // {idx, score, answered, order}
function startQuiz(){
  quizState = {idx:0, score:0, answered:false, selected:null};
  render();
}
function answerQuiz(i){
  if(quizState.answered) return;
  quizState.answered=true; quizState.selected=i;
  if(i===QUIZ_SEED[quizState.idx].correct) quizState.score++;
}
async function nextQuiz(){
  if(quizState.idx < QUIZ_SEED.length-1){ quizState.idx++; quizState.answered=false; quizState.selected=null; render(); }
  else{
    const pct = Math.round(quizState.score/QUIZ_SEED.length*100);
    let level = pct<40? t("lvl0") : pct<65? t("lvl1") : pct<90? t("lvl2") : t("lvl3");
    if(currentUser()){
      ME.quizResults.push({date:new Date().toISOString(), score:quizState.score, total:QUIZ_SEED.length, pct, level});
      await saveME();
      const u = currentUser();
      u.bestQuizPct = Math.max(u.bestQuizPct||0, pct);
      await saveDB();
      await addXP(quizState.score*10);
      await checkNewAchievements();
      toast(`+${quizState.score*10} XP`);
    }
    quizState.finished=true; quizState.level=level; quizState.pct=pct;
    render();
  }
}

  if(u.blocked){ toast(t("blocked")); return; }

function searchModal(){

  const results = q? idx.filter(r=>r.title.toLowerCase().includes(q)).slice(0,10) : [];

        oninput="searchQuery=this.value;searchActiveIdx=0;renderSearchResults()"
        onkeydown="handleSearchKey(event)">
      <button class="icon-btn" onclick="closeSearch()">✕</button>
    </div>

function searchResultsHTML(results){
  if(!searchQuery.trim()) return `<div class="search-empty">${t('search_hint')}</div>`;
  if(!results.length) return `<div class="search-empty">${t('no_results')}</div>`;
  return results.map((r,i)=>`
    <div class="search-result-item ${i===searchActiveIdx?'kbd-active':''}" onclick="go('${r.go[0]}','${r.go[1]}');closeSearch();">
      <div class="sr-em">${r.em}</div>
      <div><div>${esc(r.title)}</div><div class="sr-meta">${esc(r.type)}</div></div>
    </div>`).join('');
}
window.renderSearchResults = function(){
  const idx = buildSearchIndex();
  const q = searchQuery.trim().toLowerCase();
  const results = q? idx.filter(r=>r.title.toLowerCase().includes(q)).slice(0,10) : [];
  const wrap = document.getElementById('search-results-wrap');
  if(wrap) wrap.innerHTML = searchResultsHTML(results);
};
window.handleSearchKey = function(e){
  const idx = buildSearchIndex();
  const q = searchQuery.trim().toLowerCase();
  const results = q? idx.filter(r=>r.title.toLowerCase().includes(q)).slice(0,10) : [];
  if(e.key==='ArrowDown'){ e.preventDefault(); searchActiveIdx=Math.min(searchActiveIdx+1,results.length-1); renderSearchResults(); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); searchActiveIdx=Math.max(searchActiveIdx-1,0); renderSearchResults(); }
  else if(e.key==='Enter'){ const r=results[searchActiveIdx]; if(r){ go(r.go[0],r.go[1]); closeSearch(); } }
  else if(e.key==='Escape'){ closeSearch(); }
};

function togglePFilter(f){ pFilters.has(f)?pFilters.delete(f):pFilters.add(f); document.querySelectorAll(`.chip[data-f="${f}"]`).forEach(b=>b.classList.toggle('active')); renderPlanetList(); }
function isOpenNow(hours){
  try{
    const [from,to] = hours.replace(/[^\d:–-]/g,'').split(/[–-]/);
    const now = new Date(); const cur = now.getHours()+now.getMinutes()/60;
    const [fh,fm] = from.split(':').map(Number), [th,tm] = to.split(':').map(Number);
    const f = fh+(fm||0)/60, tt = th+(tm||0)/60;
    return cur>=f && cur<=tt;
  }catch(e){ return true; }
}
function renderPlanetList(){
  const q = (document.getElementById('pf-search')?.value||"").toLowerCase();

    const name=tf(p.nameKZ,p.nameRU).toLowerCase();
    const matchesQ = !q || name.includes(q) || p.city.toLowerCase().includes(q);
    const tagMap = {"3d":"3d","kids":"family","adult":"adult","excursion":"excursion","observation":"observation","lectures":"lectures"};
    const matchesF = pFilters.size===0 || [...pFilters].every(f=> p.tags.includes(tagMap[f]||f));
    return matchesQ && matchesF;
  });
  list = [...list].sort((a,b)=>{
    if(sortBy==="name") return tf(a.nameKZ,a.nameRU).localeCompare(tf(b.nameKZ,b.nameRU));
    if(sortBy==="city") return a.city.localeCompare(b.city);
    return b.rating-a.rating;
  });
  const el = document.getElementById('planet-list');
  if(!el) return;
  el.innerHTML = list.length? list.map(p=>{
    const open = isOpenNow(p.hours);
    return `

window.calcNumerology = async function(){
  const v = document.getElementById('num-date').value;
  if(!v){ toast(t('fill_all')); return; }
  const digits = v.replace(/-/g,'').split('').map(Number);
  let sum = digits.reduce((a,b)=>a+b,0);
  while(sum>9 && sum!==11 && sum!==22){ sum = String(sum).split('').reduce((a,b)=>a+Number(b),0); }
  const meaning = LIFEPATH_MEANINGS[sum] || LIFEPATH_MEANINGS[1];
  if(currentUser()){ ME.numerology = {date:v, number:sum}; await saveME(); }
  const seed = seededNum(v);
  const days = [
    {lbl:t('today_lbl'), off:0},
    {lbl:t('in3days'), off:3},
    {lbl:t('nextweek'), off:7}
  ];
  document.getElementById('num-result').innerHTML = `
    <div style="margin-top:22px;text-align:center;">
      <div style="font-size:3rem;font-weight:700;color:var(--cyan);">${sum}</div>
      <b>${t('lifepath')}</b>
      <p class="prose" style="margin:14px auto 0;max-width:480px;">${tf(meaning.kz,meaning.ru)}</p>
    </div>
    <h3 style="margin:28px 0 14px;">⭐ ${t('lucky_days')}</h3>
    <div class="stat-grid">
      ${days.map(d=>{
        const dt = new Date(Date.now()+d.off*86400000);
        return `<div class="stat-box"><b>${dt.toLocaleDateString(LANG==='kz'?'kk-KZ':'ru-RU',{day:'numeric',month:'short'})}</b><span>${d.lbl}</span></div>`;
      }).join('')}
    </div>`;
};

  if(!rows.length) return '';

  <div class="stat-card" style="text-align:left;max-width:520px;margin:34px auto 0;">
    <b style="font-size:0.95rem;display:block;margin-bottom:12px;">🏆 ${t('leaderboard')}</b>
    ${rows.map((u,i)=>`<div class="bar-row"><span class="lbl" style="width:24px;">#${i+1}</span><span class="lbl" style="width:110px;">${esc(u.username)}</span><div class="bar-track"><div class="bar-fill" style="width:${u.bestQuizPct}%"></div></div><span>${u.bestQuizPct}%</span></div>`).join('')}

    return `

      <div style="font-size:3rem;">🏆</div>
      <h2 style="margin:14px 0 6px;">${t('quiz_result')}: ${quizState.score}/${QUIZ_SEED.length} (${quizState.pct}%)</h2>

    </div>
    ${quizLeaderboard()}`;
  }
  const q = QUIZ_SEED[quizState.idx];
  const opts = tf(q.optKZ,q.optRU);
  const correctText = opts[q.correct];
  return `
  <div class="quiz-box">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <span class="mono" style="font-size:0.74rem;color:var(--cyan);letter-spacing:.06em;">${t('question_of')} ${String(quizState.idx+1).padStart(2,'0')} / ${String(QUIZ_SEED.length).padStart(2,'0')}</span>
      ${currentUser()? `<span class="level-chip">✦ ${(ME.xp||0)+quizState.score*10} XP</span>`:''}
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width:${(quizState.idx)/QUIZ_SEED.length*100}%"></div></div>
    <h3 style="font-size:1.15rem;margin:18px 0 22px;">${tf(q.qKZ,q.qRU)}</h3>
    ${opts.map((o,i)=>{
      let cls="quiz-opt";
      if(quizState.answered){
        if(i===q.correct) cls+=" correct";
        else if(i===quizState.selected) cls+=" wrong";
      }
      return `<button class="${cls}" onclick="answerQuiz(${i});render();" ${quizState.answered?'disabled':''}>${esc(o)}</button>`;
    }).join('')}
    ${quizState.answered? `
      <div style="margin:14px 0 6px;font-weight:700;color:${quizState.selected===q.correct?'var(--ok)':'var(--danger)'};">${quizState.selected===q.correct?'✅ '+t('correct')+' +10 XP':'❌ '+t('wrong')}</div>
      <p style="font-size:0.82rem;color:var(--ink-dimmer);margin-bottom:16px;">💡 ${t('explanation')}: ${LANG==='kz'?'дұрыс жауап —':'правильный ответ —'} <b style="color:var(--ink);">${esc(correctText)}</b></p>
      <button class="btn primary full" onclick="nextQuiz()">${quizState.idx<QUIZ_SEED.length-1? (LANG==='kz'?'Келесі →':'Далее →') : t('quiz_result')}</button>
    ` : ''}
  </div>`;
}

/* ---------- forum ---------- */
function onlineCount(){
  // stable pseudo-live figure derived from active (non-blocked) users + time of day
  const base = DB.users.filter(u=>!u.blocked).length;
  const hour = new Date().getHours();
  return Math.max(1, base + (hour%5));
}
let forumSort = "newest";
function sortTopics(list){
  const sorted = [...list];
  if(forumSort==="popular") sorted.sort((a,b)=> b.views - a.views);
  else if(forumSort==="discussed") sorted.sort((a,b)=> DB.forumPosts.filter(p=>p.topicId===b.id).length - DB.forumPosts.filter(p=>p.topicId===a.id).length);
  else sorted.sort((a,b)=> new Date(b.created) - new Date(a.created));
  return sorted;
}
function sortTabs(){
  return `<div class="filter-bar" style="margin-bottom:14px;">
    <button class="chip ${forumSort==='newest'?'active':''}" onclick="forumSort='newest';render();">${t('newest')}</button>
    <button class="chip ${forumSort==='popular'?'active':''}" onclick="forumSort='popular';render();">${t('popular')}</button>
    <button class="chip ${forumSort==='discussed'?'active':''}" onclick="forumSort='discussed';render();">${t('discussed')}</button>
  </div>`;
}

window.updateProfile = async function(e){
  e.preventDefault();
  const u = currentUser(); if(!u) return;
  const f = e.target;
  const newName = f.username.value.trim();
  if(newName && newName!==u.username){
    if(DB.users.some(x=>x.username===newName)){ toast(t('user_exists')); return; }
    DB.forumTopics.forEach(t=>{ if(t.author===u.username) t.author=newName; });
    DB.forumPosts.forEach(p=>{ if(p.author===u.username) p.author=newName; });
    u.username=newName; ME.session=newName;
  }
  if(f.password.value.trim()) u.password=f.password.value.trim();
  await saveDB(); await saveME();
  toast(t('saved_ok')); go('profile');
};

function adminDashboard(){
  const stats = [
    [t('total_users'), DB.users.length],
    [t('active_users'), DB.users.filter(u=>!u.blocked).length],
    [t('total_topics'), DB.forumTopics.length],
    [t('total_posts'), DB.forumPosts.length],
    [t('total_comments'), Object.values(DB.comments).reduce((a,b)=>a+b.length,0)],
    [t('total_planet'), DB.planetariums.length],
    [t('total_news'), DB.news.length],
    [t('total_articles'), DB.articles.length],
    [t('total_fav'), ME.favorites.length]

window.saveCRUD = async function(e, kind, i){
  e.preventDefault();
  const f = e.target, data = {};
  new FormData(f).forEach((v,k)=>data[k]=v);
  const isPlanet = kind==="planetariums";
  let obj;
  if(isPlanet){
    obj = {nameKZ:data.nameKZ,nameRU:data.nameRU,city:data.city,country:"Қазақстан",rating:parseFloat(data.rating)||4.5,em:"🌍",tags:["3d"],hours:"10:00–19:00",contact:"—",descKZ:data.descKZ,descRU:data.descRU};
  } else {
    obj = {titleKZ:data.titleKZ,titleRU:data.titleRU,descKZ:data.descKZ,descRU:data.descRU,status:data.status,em: kind==='news'?'📰':'📚',
      ...(kind==='news'? {cat:'nasa',date:new Date().toISOString().slice(0,10),id:'n'+Date.now()} : {catKZ:'Мақала',catRU:'Статья',author:currentUser().username,date:new Date().toISOString().slice(0,10),views:0,id:'a'+Date.now()})};
  }
  if(i===null){
    DB[kind].push(obj);
    await saveDB();
    if(kind==='news') await logActivity("added_news", currentUser().username);
  } else { DB[kind][i] = {...DB[kind][i], ...obj}; await saveDB(); }
  toast(t('saved_ok')); closeModal(); render();
};

/* ---------- starfield background ---------- */
function initStarfield(){
  const c = document.getElementById("starfield");
  const ctx = c.getContext("2d");
  let stars = [];
  function resize(){ c.width=window.innerWidth; c.height=window.innerHeight;
    stars = Array.from({length:140},()=>({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1.4+0.2,s:Math.random()*0.5+0.15,p:Math.random()*Math.PI*2}));
  }
  resize(); window.addEventListener("resize", resize);
  function tick(t){
    ctx.clearRect(0,0,c.width,c.height);
    ctx.fillStyle = "#050611"; ctx.fillRect(0,0,c.width,c.height);
    stars.forEach(s=>{
      const alpha = 0.35 + 0.65*Math.abs(Math.sin(t*0.0003*s.s + s.p));
      ctx.beginPath();
      ctx.fillStyle = `rgba(200,205,255,${alpha})`;
      ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fill();
    });
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

/* ---------- init ---------- */
(async function init(){
  initStarfield();
  await loadState();
  render();
